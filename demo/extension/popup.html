<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PK Token Wallet</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <div class="local-bar">
      <span class="local-bar-dot" aria-hidden="true"></span>
      <span>Browser extension · running locally</span>
    </div>

    <ul id="list" class="list"></ul>

    </p>

    <script type="module" src="popup.js"></script>
  </body>
